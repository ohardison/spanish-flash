name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Supabase config (from repo secrets)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Creating supabase-config.js"
          cat > supabase-config.js <<'JS'
          window.__SUPABASE_CONFIG__ = {
            supabaseUrl: "${SUPABASE_URL}",
            supabaseAnonKey: "${SUPABASE_ANON_KEY}"
          };
          JS

      - name: Prepare artifact for Pages
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='node_modules' --exclude='.github' --exclude='package.json' --exclude='package-lock.json' ./ _site/

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: _site
