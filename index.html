<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English-Spanish Flashcards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Login box shown before app; app container hidden until successful login -->
<div id="loginBox" class="login-box">
    <h2>Sign in / Sign up</h2>
    <input type="email" id="loginEmail" placeholder="Email" style="width:80%; padding:8px; margin:6px 0;">
    <input type="password" id="loginPass" placeholder="Password" style="width:80%; padding:8px; margin:6px 0;">
    <div style="margin-top:8px;">
      <button id="btnSignIn">Sign in</button>
      <button id="btnSignUp">Sign up</button>
    </div>
    <p id="loginMsg" style="color: red; display: none;"></p>
</div>

<!-- User info (visible when signed in) placed outside loginBox so it isn't hidden when loginBox is closed -->
<div id="userInfo" style="position:fixed; top:12px; right:12px; z-index:200; display:none;">
  <button id="btnSignOut" style="margin-left:8px; background: rgba(255,255,255,0.96); border-radius:8px; padding:6px 10px; box-shadow: 0 6px 18px rgba(0,0,0,0.08);">Sign out</button>
</div>

<div class="container" style="display: none;">

    <!-- Mode Switchers -->
    <div class="mode-box">
      <button id="modeReviewBtn">Review</button>
      <button id="modeTestBtn">Test</button>
      <button id="modeEditBtn">Edit</button>
    </div>

    <!-- Flashcard Display (always visible) -->
    <div class="flashcard">
        <div class="card-inner" id="cardInner">
            <div class="card-front" id="cardFront">Click Add to start</div>
            <div class="card-back" id="cardBack">-</div>
        </div>
    </div>

    <!-- Test Stats (always visible when in Test mode) -->
    <div id="testStats" style="display:none; text-align:center; margin-top: 12px; font-weight:bold;">
      Score: Yes <span id="yesCount">0</span> / No <span id="noCount">0</span> (<span id="testPercent">0</span>%)
    </div>

    <!-- Feedback controls (visible only after flip in Test mode) -->
    <div id="testControls" style="display:none; text-align:center; margin-top: 12px; margin-bottom: 12px;">
      <div style="font-weight:bold; margin-bottom: 6px;">Got it right?</div>
      <button id="btnYes" style="background-color:#28a745; color:white; padding:10px 20px; border:none; border-radius:8px;">Yes</button>
      <button id="btnNo" style="background-color:#dc3545; color:white; padding:10px 20px; border:none; border-radius:8px;">No</button>
      <button id="btnEnd" style="background-color:#6c757d; color:white; padding:10px 20px; border:none; border-radius:8px; margin-top: 10px;">End Test</button>
    </div>

    <!-- Report Area (for Test mode) -->
    <div id="testReport" style="display:none; margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px;">
      <h3>Missed Phrases</h3>
      <div id="missedPhrasesList"></div>
      <button id="btnRestart" style="background-color:#007bff; color:white; padding:10px 20px; border:none; border-radius:8px; margin-top: 15px;">Restart Test</button>
    </div>

    <!-- Bottom navigation: arrows (for Review/Test modes) -->
    <div class="nav-bottom" id="navBottom">
      <button id="prevBtn" class="nav-arrow" aria-label="Previous card">◀</button>
      <button id="nextBtn" class="nav-arrow" aria-label="Next card">▶</button>
    </div>

    <!-- Navigation (legacy container kept for layout fallback; hidden visually) -->
    <div class="nav-box" aria-hidden="true" style="height:0; overflow:hidden; visibility:hidden;">
        <button id="prevBtn-fallback" style="display:none">Previous</button>
        <button id="nextBtn-fallback" style="display:none">Next</button>
    </div>

    <!-- Intro line for admins (only visible to admins) -->
    <div id="adminIntro" style="display:none; margin-top:12px; font-style:italic; font-size:14px; color:#444; text-align:center;"><hr/>Admin controls<br>Delete current card, add new term below, or delete by English term.</div>

    <!-- EDIT: Form to add new words (only visible to admins) -->
    <div id="editArea" style="display:none; margin-top:16px;">
      <!-- Delete current card button centered above add form -->
      <div style="text-align:center; margin-bottom:12px;">
        <button id="btnDelete" style="padding:12px 18px; border-radius:8px; background-color:#dc3545; color:#fff; border:none;">Delete Card Above</button>
      </div>

      <h3>Add new Phrases or Words</h3>
      <div class="form-box">
          <input type="text" id="englishInput" placeholder="English">
          <input type="text" id="spanishInput" placeholder="Spanish">
          <button id="btnAdd">Add</button>
      </div>

      <!-- Delete by English term -->
      <div style="margin-top:10px; display:flex; gap:12px; align-items:center;">
        <input type="text" id="deleteEnglishInput" placeholder="English word or phrase to delete" style="flex:1; min-width:140px;">
        <button id="btnDeleteByEnglish" aria-label="Delete by English term" style="flex:0 0 140px;">Delete</button>
      </div>
      <div id="adminMsg" style="display:none; margin-top:8px; font-weight:600; color:red;"></div>
    </div>

</div>

<div id="debugUser" style="position:fixed; bottom:10px; height:13px; left:6px; width=90%; font-size:12px; font-style:italic; color:#666; z-index:60; display:none;"></div>

<!-- Optional Supabase config injected at deploy time by GitHub Actions -->
<script src="/supabase-config.js" defer></script>
<!-- Load Supabase client UMD build from CDN so browser can use it directly -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
